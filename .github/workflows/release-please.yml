name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create / update release PR, or tag + publish a GitHub Release
        id: release
        uses: googleapis/release-please-action@v4

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Trusted Publishing requires npm CLI >=11.5.1 and Node >=22.14.0.
      # Node 24 reliably bundles a recent enough npm; the explicit upgrade
      # step below is belt-and-suspenders in case a runner image lags.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # No auth token needed: npm exchanges this workflow's OIDC token for a
      # short-lived publish token via the Trusted Publisher configured on npmjs.com.
      - name: Publish to npm
        run: npm publish
